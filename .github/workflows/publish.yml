name: publish

# Publishes @penster-ai/env to GitHub Packages on each release.
# The repo is public, so consumers can also install token-free via the git
# dependency (see README) — this registry copy matches the org's @penster-ai/*
# convention (feedgen et al.).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@penster-ai"
      - run: npm ci
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
