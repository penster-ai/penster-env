[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "penster-env"
version = "0.1.0"
description = "Penster's single env-parsing boundary: empty string ≡ unset, required enforced by the field."
requires-python = ">=3.10"
dependencies = [
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/penster_env"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
